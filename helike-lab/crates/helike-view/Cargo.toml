[package]
name = "helike-view"
description = "Live viewer for helike-lab: draws frames streamed by the solver (wgpu via eframe/egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "helike-view"
path = "src/main.rs"

[dependencies]
helike-core = { path = "../helike-core" }
helike-stream = { path = "../helike-stream" }
# the Hermite basis for the state slices (spec section 4): the solver's own functions, not a copy
helike-quantum = { path = "../helike-quantum" }
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
png = "0.18"
